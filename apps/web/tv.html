<title>THRØ on a pub screen</title>

<!-- The address to type on a television: thro.uk/tv. It goes straight to the wall (PD-090), which needs no
     Apple TV, no adapter and no phone in the room: the set's own browser, or a £30 Fire or Google TV stick.
     It goes there with whatever was after the address: a meta refresh names a fixed URL, so thro.uk/tv?season=…
     — the finished address a landlord writes on a beer mat — arrived at the wall with the season dropped and the
     chooser asking again. The script carries the query and the fragment across; the refresh is kept for a browser
     that runs no script, which is the one case where there is nothing to carry. -->
<script>location.replace('wall.html' + location.search + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=wall.html"></noscript>

  </div>
</header>
<main class="measure">
  <p>Taking you to <a id="wall" href="wall.html">THRØ on the wall</a>. Type <strong>thro.uk/tv</strong> into a television's browser
