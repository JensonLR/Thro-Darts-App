<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A league table — THRØ</title>
<meta name="description" content="A league season's table, computed from the results under it.">
<!-- What a link to this page looks like when somebody sends it to somebody else. Without these a
     shared link is a bare URL with no name, no sentence and no picture, which is what every link to
     THRØ has been until now. The image is generated by tools/make_social_artwork.swift from the app's
     own wordmark geometry, so it cannot drift from the brand. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="THRØ">
<meta property="og:title" content="THRØ — a league's table">
<meta property="og:description" content="A league season's table, computed from the results under it.">
<meta property="og:image" content="og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="thro.css">
</head>
<body>
<header class="field">
  <div class="measure">
    <p class="eyebrow" id="season">Table</p>
    <p class="wordmark" id="league" style="font-size:28px">Table</p>
  </div>
</header>
<main class="measure" id="table">
  <p class="quiet">Reading the table…</p>
</main>
<footer class="measure">
  <p><a id="fixtures-link" href="index.html">Fixtures</a> · <a href="index.html">All leagues</a></p>
</footer>
<script src="thro.js"></script>
<script>
  THRO.mountTable(document.getElementById('table'), document.getElementById('league'), document.getElementById('season'));
  // The fixtures are the other half of the same season, so the link carries the season with it.
  const s = new URLSearchParams(location.search).get('season');
  if (s) document.getElementById('fixtures-link').href = 'fixtures.html?season=' + encodeURIComponent(s);
</script>
</body>
</html>
