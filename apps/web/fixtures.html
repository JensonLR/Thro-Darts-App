<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixtures — THRØ</title>
<meta name="description" content="A league season's fixtures, played and still to play.">
<!-- What a link to this page looks like when somebody sends it to somebody else. Without these a
     shared link is a bare URL with no name, no sentence and no picture, which is what every link to
     THRØ has been until now. The image is generated by tools/make_social_artwork.swift from the app's
     own wordmark geometry, so it cannot drift from the brand. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="THRØ">
<meta property="og:title" content="THRØ — a league's fixtures">
<meta property="og:description" content="What a league season has played and what it has left.">
<meta property="og:image" content="og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="thro.css">
</head>
<body>
<header class="field">
  <div class="measure">
    <p class="eyebrow" id="count">Fixtures</p>
    <p class="wordmark" id="title" style="font-size:28px">Fixtures</p>
  </div>
</header>
<main class="measure" id="fixtures">
  <p class="quiet">Reading the fixtures…</p>
</main>
<footer class="measure">
  <p><a href="index.html">All leagues</a></p>
</footer>
<script src="thro.js"></script>
<script>
  THRO.mountFixtures(document.getElementById('fixtures'), document.getElementById('title'), document.getElementById('count'));
</script>
</body>
</html>
