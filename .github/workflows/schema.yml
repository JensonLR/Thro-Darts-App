name: schema

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  properties:
    name: Event model property tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # These assert, against a real database, the properties the competitive event model depends
      # on — including the two-device corroboration case an earlier schema silently rejected, and
      # that the append-only guarantee survives a table created by a later migration.
      - name: Schema properties
        run: bash services/api/test/schema_properties.sh
