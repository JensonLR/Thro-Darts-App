name: testflight

# Builds the iOS app for TestFlight and uploads it to App Store Connect, so the founder can install it on
# the phone from the phone: run this, then open TestFlight. It runs only when asked — never on a push —
# because every upload is a build the founder will be offered.
#
# Two ways to ask:
#   - Actions → testflight → Run workflow, choosing the branch (github.com in a phone's browser works).
#   - A comment on the pull request that begins "/testflight", by the repository owner. GitHub only
#     honours comment triggers from the workflow file on the default branch, so this way works once
#     this file has been merged.
#
# It needs three repository secrets and refuses to start without them, saying so:
#   ASC_KEY_ID      the App Store Connect API key's ID (ten characters)
#   ASC_ISSUER_ID   the issuer ID shown on the same page (a UUID)
#   ASC_KEY_P8      the text of the AuthKey_<KEY_ID>.p8 file, beginning -----BEGIN PRIVATE KEY-----
# Optionally, if Apple will not let that key create a cloud-managed distribution certificate:
#   IOS_DIST_P12_BASE64   an Apple Distribution certificate with its private key, exported from Keychain
#                         Access on the founder's Mac as .p12 and base64-encoded
#   IOS_DIST_P12_PASSWORD its password
# docs/runbooks/TESTFLIGHT.md says where each comes from. None of them may ever appear in the repository.
#
# Signing: the archive is built without a certificate, its entitlements are stamped back on with an ad-hoc
# signature, and it is signed at export by Xcode's automatic signing, using the API key — a cloud-managed
# Apple Distribution certificate if the key's role allows, the imported .p12 if one was given. Export keeps
# only the entitlements the binary already carries, so without the stamp the app ships with none (PD-098).
# The build number is this workflow's run number, so every upload is newer than the last.

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive, sign and upload to TestFlight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/testflight') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      HAS_P12: ${{ secrets.IOS_DIST_P12_BASE64 != '' }}
      TEAM_ID: 2XM324WPD5
    steps:
      - name: Acknowledge the comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=rocket >/dev/null

      # This job builds a checkout with the App Store Connect key on disk and in its environment, so the
      # code it builds has to be code this repository owns. An Xcode run-script phase or a package plugin
      # in a fork's branch would run with that key. The owner gate above stops a stranger from asking for
      # a build; this stops the owner from accidentally granting one to a fork's code by commenting on
      # somebody else's pull request.
      - name: Find the pull request's head, and refuse a fork
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            pr=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")
            repo=$(printf '%s' "$pr" | jq -r .head.repo.full_name)
            if [ "$repo" != "${{ github.repository }}" ]; then
              echo "::error::/testflight builds only branches of ${{ github.repository }}; this pull request's head is on $repo. Signing secrets are not handed to a fork's build scripts."
              exit 1
            fi
            sha=$(printf '%s' "$pr" | jq -r .head.sha)
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.sha }}

      - name: Refuse without the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::TestFlight is not configured: missing repository secret(s):$missing. docs/runbooks/TESTFLIGHT.md says where they come from."
            exit 1
          fi

      - name: Install the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Import the distribution certificate, if one was given
        if: env.HAS_P12 == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/thro.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Archive, without a certificate
        run: |
          xcodebuild -project apps/ios/ThroDarts.xcodeproj -scheme ThroDarts -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ThroDarts.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} -quiet archive

      # **Export signs with the entitlements the binary already carries, and this archive carries none**
      # (PD-098). CODE_SIGNING_ALLOWED=NO skips writing them, so build 6 reached TestFlight without Sign in
      # with Apple, its passkey domain or its App Group, and Sign in with Apple failed on the phone with
      # Apple's error 1000. An ad-hoc signature costs no certificate and puts them back; export then replaces
      # it with the distribution signature and keeps them. Xcode refuses ad-hoc signing inside the build on
      # the iOS 26 SDK, so it is done here, afterwards — the extension first, because signing the app seals
      # what is inside it.
      - name: Put the entitlements back on the archive
        run: |
          app="$RUNNER_TEMP/ThroDarts.xcarchive/Products/Applications/ThroDarts.app"
          live="$app/PlugIns/ThroLive.appex"
          for bundle in "$live" "$app"; do
            [ -d "$bundle" ] || { echo "::error::$(basename "$bundle") is not in the archive, so its entitlements cannot be put back. A target was renamed; this step names bundles."; exit 1; }
          done
          codesign --force --sign - --entitlements apps/ios/SupportLive/ThroLive.entitlements "$live"
          codesign --force --sign - --entitlements apps/ios/Support/ThroDarts.entitlements "$app"

      # **Nothing reaches a tester until the signed app is known to carry them.** An upload leaves no file
      # to look inside, so the archive is signed once into a folder and read, and only then signed again
      # to upload. Sign in with Apple and the passkey domain refuse the upload: without them nobody can
      # sign in, and the build is worse than none. The App Group only reports, as it always has — every
      # thing but the widgets works without it.
      - name: Sign, and refuse a build that cannot sign in
        run: |
          cat > "$RUNNER_TEMP/CheckOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ThroDarts.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/CheckOptions.plist" -exportPath "$RUNNER_TEMP/check" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" -quiet
          ipa=$(find "$RUNNER_TEMP/check" -maxdepth 1 -name '*.ipa' -print -quit)
          [ -n "$ipa" ] || { echo "::error::The signed export left no .ipa to check."; exit 1; }
          work="$RUNNER_TEMP/signed" && rm -rf "$work" && mkdir -p "$work" && unzip -qq "$ipa" -d "$work"
          entitlements() { codesign -d --entitlements - --xml "$1" 2>/dev/null; }
          app=$(find "$work/Payload" -maxdepth 1 -name '*.app' -print -quit)
          refused=""
          for key in com.apple.developer.applesignin com.apple.developer.associated-domains; do
            if entitlements "$app" | grep -q "<key>$key</key>"; then
              echo "- $key: present in ThroDarts.app" >> "$GITHUB_STEP_SUMMARY"
            else
              refused="$refused $key"
            fi
          done
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            [ -e "$bundle" ] || continue
            if entitlements "$bundle" | grep -q 'group.app.thro.darts'; then
              echo "- App Group: present in $(basename "$bundle")" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **App Group MISSING from $(basename "$bundle").** The widgets will read an empty container and draw nothing. Tick App Groups on the \`app.thro.darts\` App ID (docs/runbooks/TESTFLIGHT.md) and run again; nothing else in the app is affected." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          rm -rf "$work" "$RUNNER_TEMP/check"
          if [ -n "$refused" ]; then
            echo "- **Not uploaded: the signed app is missing$refused.** Nobody could sign in to this build." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The signed app is missing$refused, so it was not uploaded. Check the capability is ticked on the app.thro.darts App ID and that the entitlements step above ran (docs/runbooks/TESTFLIGHT.md)."
            exit 1
          fi

      - name: Sign and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ThroDarts.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Say what was uploaded
        run: |
          {
            echo "## TestFlight build ${{ github.run_number }}"
            echo
            echo "- commit \`${{ steps.head.outputs.sha }}\`"
            echo "- version 0.1 (${{ github.run_number }})"
            echo "- App Store Connect processes it for a few minutes, then TestFlight offers it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reply on the pull request
        if: github.event_name == 'issue_comment' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            body="TestFlight build ${{ github.run_number }} uploaded from \`${{ steps.head.outputs.sha }}\`. App Store Connect processes it for a few minutes, then TestFlight offers it."
          else
            body="TestFlight build ${{ github.run_number }} did not upload. The log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -f body="$body

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" >/dev/null

      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/private_keys" "$RUNNER_TEMP/thro.keychain-db" "$RUNNER_TEMP/export" 2>/dev/null || true
