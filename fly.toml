# THRØ API on Fly.io (PD-031, ADR-011). One image, London, migrations as the release step.
#
# Pick the app name at `fly launch`; ADR-011 asks that permanent identifiers avoid the product
# name, so prefer something like "<company>-api-staging" / "<company>-api". Two apps — staging and
# production — from this one file: `fly deploy --config fly.toml --app <name>`.
app = "thro-api-staging"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

# ADR-013: the database is brought to the image's version before the image serves. The release
# command runs the same image with the deploy role's credentials (set PGUSER/PGPASSWORD as secrets
# for a user that is thro_owner or a member of it).
[deploy]
  release_command = "migrate"
  strategy = "rolling"

[env]
  PORT = "8080"
  PGSSLMODE = "require"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # SSE streams (ADR-007) do not survive a machine stopping under them
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
